# Publishes site/ (the built single-file app) to GitHub Pages on every push to main.
# Run ./build.sh and commit site/ before pushing; this workflow does not build.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check site/ is up to date with src/
        run: |
          ./build.sh
          git diff --exit-code -- site/ || { echo "::error::site/ is stale. Run ./build.sh and commit."; exit 1; }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
