<title>Doggo Vision Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* The picture is the product: it fills the screen. Chrome is near-monochrome glass floating over it,
   so the only colour on screen is the dog's view itself. */
:root{
  --glass:rgba(250,250,250,.86); --glass-2:rgba(0,0,0,.05); --line:rgba(0,0,0,.10); --fg:#121212; --muted:#6b6b6b; --faint:#9a9a9a;
  --accent:#121212; --on-accent:#fafafa; --warn:#a3302a; --stage:#0b0b0b;
  --over-fg:#f4f4f4; --over-bg:rgba(16,16,16,.52); --over-bg-hi:rgba(16,16,16,.72);
  --f-body:"Inter", -apple-system, "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --glass:rgba(22,22,22,.84); --glass-2:rgba(255,255,255,.06); --line:rgba(255,255,255,.10); --fg:#ececec; --muted:#9b9b9b; --faint:#6e6e6e;
  --accent:#ececec; --on-accent:#121212; --warn:#ff8f86; color-scheme:dark }}
:root[data-theme="dark"]{
  --glass:rgba(22,22,22,.84); --glass-2:rgba(255,255,255,.06); --line:rgba(255,255,255,.10); --fg:#ececec; --muted:#9b9b9b; --faint:#6e6e6e;
  --accent:#ececec; --on-accent:#121212; --warn:#ff8f86; color-scheme:dark }
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--stage);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--over-fg);outline-offset:2px}
.app{position:fixed;inset:0}
/* keep the whole picture visible next to (or above) the open settings */
@media (min-width:701px){ .app.drawer-open .viewport{right:calc(var(--safe-r) + 428px)} }
@media (max-width:700px){ .app.drawer-open .viewport{bottom:min(68dvh, 620px)} .app.drawer-open .bottombar{display:none} }

/* the picture */
.viewport{position:absolute;inset:0;background:var(--stage);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.viewport canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.split{position:absolute;top:0;bottom:0;width:1px;margin-left:-.5px;background:rgba(255,255,255,.7);pointer-events:none}
.split .knob{position:absolute;top:50%;left:50%;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:rgba(255,255,255,.92);box-shadow:0 2px 10px rgba(0,0,0,.35);display:grid;place-items:center;color:#111}
.split .knob svg{width:16px;height:16px}
.tag{position:absolute;top:calc(var(--safe-t) + 70px);font:500 10.5px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.78);text-shadow:0 1px 3px rgba(0,0,0,.6);pointer-events:none}
.tag.l{left:calc(var(--safe-l) + 18px)}.tag.r{right:calc(var(--safe-r) + 18px)}
.drop{position:absolute;inset:14px;border:1.5px dashed rgba(255,255,255,.6);border-radius:14px;display:grid;place-items:center;color:var(--over-fg);font-weight:500;background:rgba(0,0,0,.45)}
.glfail{position:absolute;inset:0;display:grid;place-items:center;color:var(--over-fg);padding:24px;text-align:center}

/* floating bars */
.bar{position:absolute;left:0;right:0;display:flex;align-items:center;gap:10px;pointer-events:none;color:var(--over-fg);
  padding-left:calc(var(--safe-l) + 14px);padding-right:calc(var(--safe-r) + 14px)}
.bar > *{pointer-events:auto}
.topbar{top:0;padding-top:calc(var(--safe-t) + 12px);padding-bottom:22px;background:linear-gradient(rgba(0,0,0,.42),rgba(0,0,0,0));justify-content:space-between}
.bottombar{bottom:0;padding-bottom:calc(var(--safe-b) + 12px);padding-top:22px;background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.34));justify-content:space-between;align-items:flex-end}
.title{border:0;background:none;padding:2px 4px;text-align:left;cursor:pointer;display:grid;gap:1px;min-width:0;color:var(--over-fg)}
.title small{font:500 10px/1.2 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;opacity:.62}
.title span{font-weight:600;font-size:16px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 4px rgba(0,0,0,.45)}
.title span::after{content:"";display:inline-block;width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg);margin:0 0 4px 8px;opacity:.7}
.icons{display:flex;gap:6px;flex:none}
.ib{position:relative;border:0;height:38px;min-width:38px;padding:0 10px;border-radius:999px;background:var(--over-bg);color:var(--over-fg);display:inline-flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font-size:13px;font-weight:500}
.ib:hover,.ib[aria-expanded="true"]{background:var(--over-bg-hi)}
.ib[aria-expanded="true"]{box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}
.ib svg{width:18px;height:18px;flex:none}
.ib.sm{height:32px;min-width:32px;padding:0;background:var(--glass-2);color:var(--fg);backdrop-filter:none}
.ibl{display:none}
.dot{position:absolute;top:3px;right:3px;min-width:15px;height:15px;border-radius:999px;background:var(--over-fg);color:#111;font:600 9.5px/15px var(--f-mono);text-align:center;padding:0 3px}
@media (min-width:1000px){ .ibl{display:inline} .ib{padding:0 14px 0 12px} .dot{position:static;margin-left:-2px} }

.hud{display:flex;gap:6px;flex-wrap:wrap;max-width:min(60%, 560px)}
.chip{font:500 11px/1.25 var(--f-mono);color:var(--over-fg);background:var(--over-bg);padding:6px 8px;border-radius:7px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.chip b{font-weight:600;color:#fff}
.media{display:flex;gap:6px;position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--safe-b) + 12px)}
.pill{border:0;height:36px;padding:0 16px;border-radius:999px;background:var(--over-bg-hi);color:var(--over-fg);cursor:pointer;font-weight:500;font-size:13px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.pill:hover{background:rgba(16,16,16,.85)}
.zoom{display:flex;gap:2px;background:var(--over-bg);border-radius:999px;padding:3px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);margin-left:auto}
.zoom button{border:0;background:transparent;color:var(--over-fg);min-width:32px;height:30px;border-radius:999px;cursor:pointer;font:500 12px var(--f-mono)}
.zoom button:hover{background:rgba(255,255,255,.12)}

/* menus and notices (theme glass) */
.menu,.drawer,.camnote,.urgent{background:var(--glass);color:var(--fg);backdrop-filter:blur(24px) saturate(1.1);-webkit-backdrop-filter:blur(24px) saturate(1.1);border:1px solid var(--line);box-shadow:0 12px 40px rgba(0,0,0,.28)}
.menu{position:absolute;top:calc(var(--safe-t) + 60px);right:calc(var(--safe-r) + 14px);width:290px;border-radius:16px;padding:12px;display:grid;gap:6px;z-index:5}
.mlabel{font:500 10px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:6px 4px 2px}
.mlabel:first-child{margin-top:2px}
.mi{display:flex;align-items:center;gap:10px;border:0;background:transparent;border-radius:10px;padding:9px 8px;cursor:pointer;font-weight:500;text-align:left;width:100%}
.mi:hover{background:var(--glass-2)}
.mi svg{width:18px;height:18px;color:var(--muted)}
.mi[aria-pressed="true"]{background:var(--glass-2)}
.mcheck{display:flex;align-items:center;gap:8px;padding:8px 4px 2px;cursor:pointer}
.mcheck.boxed{border:1px solid var(--line);border-radius:12px;padding:10px;margin:4px 0 10px;align-items:flex-start}
.mcheck.boxed span{display:grid;gap:2px}
.mcheck.boxed small{color:var(--muted);font-size:11.5px}
#binoCtl{margin-bottom:8px}
#binoCtl .seg{margin-bottom:4px}
.mcheck input,.check input,.chead input{accent-color:var(--accent);width:16px;height:16px;flex:none}
.seg{display:flex;background:var(--glass-2);border-radius:10px;padding:3px}
.seg button{flex:1;border:0;background:transparent;padding:7px 8px;border-radius:8px;cursor:pointer;color:var(--muted);font-size:13px;font-weight:500;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
select.sel{width:100%;border:0;background:var(--glass-2);padding:9px 10px;border-radius:10px;font-size:13px}
.btn{border:1px solid var(--line);background:transparent;padding:7px 12px;border-radius:999px;cursor:pointer;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--glass-2)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.camnote,.urgent{position:absolute;top:calc(var(--safe-t) + 64px);left:50%;transform:translateX(-50%);width:min(520px, calc(100% - 28px));border-radius:14px;padding:12px 14px;z-index:4}
.camnote{display:flex;gap:8px 12px;align-items:center;flex-wrap:wrap}
.camnote a{color:var(--fg);font-weight:600;word-break:break-all}
.camnote .btn{margin-left:auto;padding:4px 12px}
.urgent{color:var(--warn);font-weight:600}
.urgent + .camnote{top:calc(var(--safe-t) + 130px)}

/* settings drawer: right column on wide screens, bottom sheet on phones */
.drawer{position:absolute;z-index:6;top:calc(var(--safe-t) + 62px);right:calc(var(--safe-r) + 14px);bottom:calc(var(--safe-b) + 14px);width:400px;border-radius:18px;display:grid;grid-template-rows:auto minmax(0,1fr);overflow:hidden}
.dhead{display:flex;align-items:center;gap:6px;padding:8px 8px 0 10px;border-bottom:1px solid var(--line)}
.tabs{display:flex;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:transparent;padding:10px 7px 11px;cursor:pointer;color:var(--muted);font-weight:500;font-size:13px;border-bottom:1.5px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--fg)}
.dbody{overflow-y:auto;overflow-x:hidden;min-height:0;overscroll-behavior:contain}
.dbody > *{min-width:0;max-width:100%}
.pane{padding:14px 16px 6px}
.foot{color:var(--faint);font-size:11.5px;margin:4px 16px 18px}
.pane h3{font-weight:600;font-size:12px;letter-spacing:.02em;margin:20px 0 8px;color:var(--fg)}
.pane h3:first-child{margin-top:2px}
.lede{color:var(--muted);font-size:12.5px;margin:0 0 10px}
.presets{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.preset{border:1px solid var(--line);background:transparent;border-radius:12px;padding:9px 10px;text-align:left;cursor:pointer;display:grid;gap:2px}
.preset:hover{background:var(--glass-2)}
.preset b{font-weight:600;font-size:12.5px}
.preset span{color:var(--muted);font-size:11.5px;line-height:1.3}
.preset[aria-pressed="true"]{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.ctl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:7px 0}
.ctl label{font-size:13px;display:flex;align-items:center;gap:6px;min-width:0}
.ctl output{font:500 12px var(--f-mono);font-variant-numeric:tabular-nums;text-align:right;color:var(--muted)}
.ctl input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--accent);margin:4px 0 0}
.ctl .hint{grid-column:1/-1;color:var(--muted);font-size:11.5px;line-height:1.35}
.ctl select{grid-column:2;border:0;background:var(--glass-2);border-radius:8px;padding:5px 8px;font-size:12.5px;max-width:190px}
.conf{font:500 9px/1 var(--f-mono);border-radius:4px;padding:3px 4px;letter-spacing:.04em;cursor:help;flex:none;color:var(--muted);border:1px solid var(--line)}
.conf.E{background:var(--fg);color:var(--on-accent);border-color:var(--fg)}
.conf.S{border-style:dashed}
.check{display:flex;align-items:center;gap:8px;padding:7px 0;font-size:13px;cursor:pointer}
.derived{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 12px;font-size:12.5px;margin:6px 0 0}
.derived dt{color:var(--muted)}
.derived dd{margin:0;font:500 12px var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
.fov{display:grid;grid-template-columns:130px minmax(0,1fr);gap:12px;align-items:center;margin-top:6px}
.fov svg{width:130px;height:auto;max-width:100%}
.legend{display:grid;gap:5px;font-size:12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.spec{display:grid;gap:4px;margin:4px 0 6px}
.spec canvas{width:100%;height:18px;border-radius:5px;display:block}
.spec .row{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px;align-items:center;font-size:11.5px;color:var(--muted)}
.ticks{position:relative;height:14px;margin-left:52px}
.ticks span{position:absolute;transform:translateX(-50%);font:500 10px var(--f-mono);color:var(--muted)}
.ticks span.np{color:var(--fg)}
.cgroup{margin-top:16px}
.cgroup>h4{font:500 10px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 6px;display:flex;justify-content:space-between}
.cond{border:1px solid var(--line);border-radius:12px;margin-bottom:6px;min-width:0}
.cond.on{border-color:var(--fg);background:var(--glass-2)}
.chead{display:flex;align-items:center;gap:8px;padding:9px 10px;cursor:pointer}
.chead .nm{font-weight:500;font-size:13px;flex:1;min-width:0}
.chead .sv{font:500 11.5px var(--f-mono);color:var(--muted)}
.photo{font:500 9.5px var(--f-mono);border-radius:999px;padding:2px 7px;border:1px solid var(--line);color:var(--faint);white-space:nowrap}
.photo.yes{color:var(--fg);border-color:var(--muted)}
.cbody{padding:0 10px 8px;border-top:1px solid var(--line)}
.cbody p{margin:8px 0 0;color:var(--muted);font-size:12px}
.row2{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.pipe{display:grid;gap:4px}
.st{display:flex;align-items:center;gap:10px;border:0;background:transparent;border-radius:10px;padding:8px 6px;cursor:pointer;font-size:13px;text-align:left;width:100%}
.st:hover{background:var(--glass-2)}
.st .n{font:500 10.5px var(--f-mono);width:22px;height:22px;border-radius:6px;display:grid;place-items:center;background:var(--accent);color:var(--on-accent);flex:none}
.st[aria-pressed="false"]{color:var(--faint);text-decoration:line-through}
.st[aria-pressed="false"] .n{background:transparent;color:var(--faint);box-shadow:inset 0 0 0 1px var(--line)}
.st.fixed{cursor:default;opacity:.6}
.jsonbox{position:relative;margin-top:6px}
.jsonbox pre{margin:0;background:var(--glass-2);border-radius:10px;padding:10px 12px;font:11.5px/1.5 var(--f-mono);max-height:240px;overflow:auto;white-space:pre}
.jsonbox .btn{position:absolute;top:6px;right:6px;padding:3px 9px;font-size:11.5px;background:var(--glass)}
textarea.imp{width:100%;min-height:110px;border:0;border-radius:10px;background:var(--glass-2);font:12px/1.5 var(--f-mono);padding:10px;resize:vertical}
.note{font-size:12px;color:var(--muted);border-left:2px solid var(--line);padding:4px 0 4px 10px;margin:10px 0}
.msg{font-size:12.5px;margin-top:8px;min-height:1.2em}
.msg.err{color:var(--warn)}
.toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 70px);transform:translateX(-50%);background:var(--over-bg-hi);color:var(--over-fg);padding:9px 14px;border-radius:999px;font-size:13px;z-index:20;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);max-width:calc(100% - 28px);text-align:center}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (max-width:700px){
  .menu{left:calc(var(--safe-l) + 10px);right:calc(var(--safe-r) + 10px);width:auto}
  .drawer{top:auto;left:0;right:0;bottom:0;width:auto;max-height:min(68dvh, 620px);height:68dvh;border-radius:20px 20px 0 0;border-bottom:0;padding-bottom:var(--safe-b)}
  .drawer::before{content:"";position:absolute;top:6px;left:50%;width:36px;height:4px;margin-left:-18px;border-radius:2px;background:var(--line)}
  .dhead{padding-top:14px}
  .hud{max-width:100%}
  .hud .chip:nth-child(n+3){display:none}
  .media{bottom:calc(var(--safe-b) + 56px)}
  .tag{top:calc(var(--safe-t) + 66px)}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
